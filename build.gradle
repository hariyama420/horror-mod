plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'org.hariyama'
version = '1.0.0'
base { archivesName = 'horrormode' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods { horrormode { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar.finalizedBy('reobfJar')

tasks.register('healthDrainCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.hariyama.horrormode.HealthDrainCheck'
}
tasks.named('check') { dependsOn 'healthDrainCheck' }
